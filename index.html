// ==========================================
// 4. 画布与离屏图层 (Canvas & Layers)
// ==========================================
const cv = document.getElementById('stage'), ctx = cv.getContext('2d')
let S = 1, dpr = devicePixelRatio, SW, SH
let layers, bgCanvas
let currentSprite = new Image()
let currentOutline = []

function loadActiveSprite() {
  currentSprite = new Image()
  currentSprite.src = activeObj.src
  currentOutline = activeObj.outline.map(([lx, ly, nx, ny]) => ({
    lx: lx * activeObj.size,
    ly: ly * activeObj.size,
    nx, ny
  }))
  currentSprite.onload = () => {
    try {
      currentOutline = traceOutline(currentSprite, activeObj.size)
    } catch (e) {
      // Running under file:// fallback to precomputed outline
    }
    draw()
  }
}

function traceOutline(img, size) {
  const N = 96, c = document.createElement('canvas'); c.width = img.width; c.height = img.height
  const g2 = c.getContext('2d'); g2.drawImage(img, 0, 0)
  const a = g2.getImageData(0, 0, c.width, c.height).data, cx = c.width / 2, cy = c.height / 2
  const pts = []
  for (let i = 0; i < N; i++) {
    const th = i / N * Math.PI * 2, dx = Math.cos(th), dy = Math.sin(th)
    let last = null
    for (let r = 0; r < c.width; r += 2) {
      const x = Math.round(cx + dx * r), y = Math.round(cy + dy * r)
      if (x < 0 || y < 0 || x >= c.width || y >= c.height) break
      if (a[(y * c.width + x) * 4 + 3] > 60) last = { x, y }
    }
    if (last) pts.push(last)
  }
  const k = size / img.height
  return pts.map((p, i) => {
    const q = pts[(i + 1) % pts.length], o = pts[(i - 1 + pts.length) % pts.length]
    let tx = q.x - o.x, ty = q.y - o.y; const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L
    let nx = ty, ny = -tx
    if ((p.x - cx) * nx + (p.y - cy) * ny < 0) { nx = -nx; ny = -ny }
    return { lx: (p.x - cx) * k, ly: (p.y - cy) * k, nx, ny }
  })
}

function shedPoint() {
  if (!currentOutline.length) return { x: g.x, y: g.y, nx: 0, ny: -1 }
  const spd = Math.hypot(g.vx, g.vy) || 1, dx = g.vx / spd, dy = g.vy / spd
  const c = Math.cos(g.angle), sn = Math.sin(g.angle)
  const w = currentOutline.map(o => {
    const nx = o.nx * c - o.ny * sn, ny = o.nx * sn + o.ny * c
    const along = nx * dx + ny * dy
    return Math.pow(Math.max(0, -along), 1.5) + .35 * (1 - Math.abs(along))
  })
  let t = R() * w.reduce((a, b) => a + b, 0), i = 0
  while (i < w.length - 1 && (t -= w[i]) > 0) i++
  const o = currentOutline[i], nx = o.nx * c - o.ny * sn, ny = o.nx * sn + o.ny * c
  return { x: g.x + o.lx * c - o.ly * sn, y: g.y + o.lx * sn + o.ly * c, nx, ny }
}

// ==========================================
// 5. 模拟与物理循环 (Simulation Loop)
// ==========================================
let R = Crayon.rng(1)
let g, T, camera = 0, contact = null, path = [], bubbles = [], froth = [], drops = [], dragging = false, isPoised = true
let frothX0 = 0, frothHalf = 165
const T0 = .05

function expansion(wet) {
  const t = Math.max(0, wet)
  return P.spreadRate * (Math.pow(t + T0, P.spreadPow) - Math.pow(T0, P.spreadPow))
}

function replay(seed = activeObj ? activeObj.seed : 1) {
  R = Crayon.rng(seed); T = 0; camera = 0; contact = null
  path = []; bubbles = []; froth = []; drops = []
  isPoised = true
  dragging = false
  g = {
    x: WW * 0.5, y: Math.round(WH * 0.42), vx: 0, vy: 0,
    angle: activeObj.id === 'crayon' ? 0.02 : -0.08,
    av: 0, air: 0, releaseT: 0, hover: 0,
    snorkelAir: 0, glugT: 0
  }
  if (typeof updateHintBar === 'function') updateHintBar()
}

function resize(customW, customH) {
  const cssW = customW || window.innerWidth
  const cssH = customH || window.innerHeight
  dpr = Math.min(window.devicePixelRatio || 1, 2)

  // 动态屏幕适配标度 s (每个世界单位对应的屏幕 CSS 像素)
  let s
  if (cssW < 600) {
    // 竖屏手机：自适应宽度，确保物体在画面中占比约 50%，周围留出适宜的落水与水花空间
    s = Math.max(0.48, Math.min(0.72, cssW / 580))
  } else if (cssW < cssH) {
    // 平板竖屏
    s = Math.max(0.65, Math.min(1.05, cssW / 750))
  } else {
    // 宽屏桌面/笔记本：同时考量宽高比
    s = Math.max(0.75, Math.min(1.3, Math.min(cssW / 1100, cssH / 720)))
  }

  S = s * dpr
  WW = cssW / s
  WH = cssH / s
  SW = Math.round(cssW * dpr)
  SH = Math.round(cssH * dpr)

  // 水面高度定位：初始视口中天空占 2/3 (约 67%)，海洋占 1/3 (约 33%)
  WATER = Math.round(WH * (2 / 3))
  WORLD_H = Math.round(WATER + Math.max(1400, WH * 1.5))

  cv.width = SW
  cv.height = SH
  cv.style.width = cssW + 'px'
  cv.style.height = cssH + 'px'

  layers = [
    new Crayon.Layer(SW, SH, { name: 'tufts', grain: .55, blend: 'multiply' }),
    new Crayon.Layer(SW, SH, { name: 'swoosh', grain: .6 }),
    new Crayon.Layer(SW, SH, { name: 'back-chalk', grain: .42 }),
    new Crayon.Layer(SW, SH, { name: 'back-pencil', grain: .62 }),
    new Crayon.Layer(SW, SH, { name: 'front-chalk', grain: .42 }),
    new Crayon.Layer(SW, SH, { name: 'front-pencil', grain: .62 }),
    new Crayon.Layer(SW, SH, { name: 'inverse', grain: .45, blend: 'multiply' }),
  ]

  if (isPoised && g) {
    g.x = WW * 0.5
    g.y = Math.round(WH * 0.42)
  }

  bakeBg()
}

function bakeBg() {
  bgCanvas = document.createElement('canvas'); bgCanvas.width = SW; bgCanvas.height = Math.round(WORLD_H * S)
  const b = bgCanvas.getContext('2d'), Rb = Crayon.rng(7)
  b.fillStyle = '#dcecf5'; b.fillRect(0, 0, SW, WATER * S)
  const grad = b.createLinearGradient(0, WATER * S, 0, WORLD_H * S)
  grad.addColorStop(0, '#008ff2'); grad.addColorStop(.35, '#007cd0'); grad.addColorStop(1, '#005896')
  b.fillStyle = grad; b.fillRect(0, WATER * S, SW, (WORLD_H - WATER) * S)
  if (P.hatch > 0 && P.showWater) {
    const hl = new Crayon.Layer(SW, bgCanvas.height, { grain: .5, blend: 'multiply' })
    const n = Math.round(WW / 6 * P.hatch * 1.6)
    for (let i = 0; i < n; i++) {
      const x = Rb() * WW, y0 = WATER + 40 + Rb() * (WORLD_H - WATER - 40), len = 60 + Rb() * 220
      Crayon.hatch(hl.ctx, x * S, y0 * S, Math.PI / 2 + (Rb() - .5) * .06, len * S, {
        width: (2 + Rb() * 3) * S, color: 'rgb(30,80,120)', alpha: .06 + Rb() * .16, seed: i, bend: .05, swell: 1.4
      })
    }
    hl.composite(b)
  }
}

function emit(x, y, r, o) {
  bubbles.push(Object.assign({
    x, y, r, vx: 0, vy: 0, age: 0, seed: R() * 1000, alpha: 1, kind: 'disc', k: 1 - P.ringMix, layer: 'front', phase: R() * 7, tau: P.tau
  }, o))
}

function local(lx, ly) {
  const c = Math.cos(g.angle), s = Math.sin(g.angle)
  return { x: g.x + lx * c - ly * s, y: g.y + lx * s + ly * c }
}

function snorkelTop() {
  return local(.4 * activeObj.size, -.42 * activeObj.size)
}

function step(dt) {
  T += dt
  if (isPoised) {
    g.vx = 0; g.vy = 0; g.av = 0; camera = 0
    return
  }
  if (dragging) return

  const nose = g.y + activeObj.noseOffset * activeObj.size
  const immersion = Crayon.clamp((nose - waterHeight(g.x, T)) / 65, 0, 1)

  if (immersion > 0 && contact === null) {
    contact = T
    const wy = waterHeight(g.x, T)
    frothX0 = g.x; frothHalf = activeObj.id === 'crayon' ? 45 : 165

    // 动态空气预算：入水冲击速度决定带入空气量与气团尺寸
    // 基准速度取 550 (约自由落体 100px)。贴水松手 (~150) -> 0.25；顶端高空落下 (~1100) -> 2.2
    const impactSpeed = Math.hypot(g.vx, g.vy) || 550
    const speedFactor = Crayon.clamp(Math.pow(impactSpeed / 550, 1.3), 0.2, 2.5)

    // 空气预算直接随速度大范围缩放
    const actualAir = Math.round(P.airTotal * speedFactor)
    g.air = actualAir
    g.snorkelAir = activeObj.hasSnorkel ? Math.round(P.snorkel * speedFactor) : 0
    g.glugT = .15

    // 水面泡沫云宽度与颗粒数量、大小均随速度强烈联动！
    const baseHalf = activeObj.id === 'crayon' ? 25 : (activeObj.id === 'camera' ? 75 : 165)
    frothHalf = baseHalf * Crayon.clamp(Math.sqrt(speedFactor), 0.5, 1.8)

    const fCount = Math.round(P.froth * speedFactor)
    const dynamicFrothR = P.frothR * Crayon.clamp(Math.sqrt(speedFactor), 0.6, 1.5)
    for (let i = 0; i < fCount; i++) {
      const u0 = (R() - .5) * 2
      froth.push({
        u0, x: g.x + u0 * frothHalf, y: wy + (R() - .35) * (35 * speedFactor),
        r: dynamicFrothR * (1 - P.frothRVar + R() * P.frothRVar * 2), age: 0, seed: R() * 100, inv: R() < .6,
        life: Math.max(.15, P.frothLife * (1 - P.frothEdge * Math.abs(u0)) * (.55 + R() * .9))
      })
    }

    // 水下气团数量与深浅：高空落下气团冲得更深、范围更宽
    const cCount = Math.round(P.cloud * speedFactor)
    const dynamicCloudR = P.cloudR * Crayon.clamp(Math.sqrt(speedFactor), 0.6, 1.4)
    for (let i = 0; i < cCount; i++) {
      emit(g.x + (R() - .5) * (frothHalf * 1.2), nose + (R() - .5) * (40 * speedFactor), dynamicCloudR * (.7 + R() * .6), {
        vx: g.vx * .9 + (R() - .5) * (120 * speedFactor),
        vy: g.vy * (.7 + R() * .35),
        tau: P.cloudTau * Crayon.clamp(speedFactor, 0.7, 1.4),
        layer: 'back', src: 'cloud'
      })
    }

    // 飞溅水花滴数与射出速度：低空几乎无飞溅，高空剧烈飞溅！
    const dropN = Math.round(10 * Math.pow(speedFactor, 1.4))
    for (let i = 0; i < dropN; i++) {
      drops.push({
        x: g.x + (R() - .5) * (frothHalf * .9), y: wy,
        vx: (R() - .5) * (180 * speedFactor), vy: -(100 + R() * 260) * speedFactor,
        age: 0, seed: R() * 50
      })
    }
  }

  const wet = contact === null ? 0 : T - contact
  const settle = smooth((wet - CAMERA_DELAY) / CAMERA_DURATION)
  const current = Math.sin(T * 1.4) * 6
  const buoyancy = immersion * GRAVITY * P.buoy
  const linearDrag = .45
  const netGravity = GRAVITY * (1 - P.buoy)
  const quad = Math.max(0, (netGravity - linearDrag * P.terminal) / (P.terminal * P.terminal))
  const impactDrag = .5 * .0015 * Math.exp(-wet / .12)
  const resistance = immersion * (linearDrag * g.vy + (quad + impactDrag) * g.vy * Math.abs(g.vy))

  g.hover = settle
  g.vy += (GRAVITY * (1 - immersion * P.buoy * (1 + g.hover)) - resistance) * dt
  if (g.hover > 0) g.vy *= Math.exp(-g.hover * 3 * dt)
  g.vx += ((current - g.vx) * immersion * 3 - g.angle * immersion * 240 + (WW * 0.5 - g.x) * settle * 2) * dt

  const entryTorque = contact === null ? 0 : P.torque * Math.exp(-wet / .10)
  const torque = immersion * (-g.angle * 42 + entryTorque)
  g.av += (torque - g.av * (.25 + immersion * 4)) * dt
  g.x += g.vx * dt; g.y += g.vy * dt; g.angle += g.av * dt

  if (g.hover > .99) {
    g.y += Math.sin(T * 1.1) * .25
    g.angle += Math.sin(T * .85) * .0004
  }

  // 空气预算释放
  if (contact !== null && g.air > 0) {
    const rate = P.airTotal / P.airTau * Math.exp(-wet / P.airTau)
    g.releaseT += rate * dt
    while (g.releaseT >= 1 && g.air > 0) {
      g.releaseT -= 1; g.air -= 1
      const p = shedPoint()
      const left = g.air / P.airTotal
      const r = P.beadR * (1 + (R() - .5)) * (.55 + .45 * left)
      emit(p.x + p.nx * 5, p.y + p.ny * 5, r, {
        vx: g.vx * P.entrain + p.nx * 25 + (R() - .5) * (25 + 50 * (1 - left)),
        vy: g.vy * P.entrain + p.ny * 25,
        layer: 'front', src: 'bead'
      })
    }
  }

  // 呼吸管咕嘟（仅潜水镜具有）
  if (activeObj.hasSnorkel && contact !== null && g.snorkelAir > 0) {
    g.glugT -= dt
    if (g.glugT <= 0) {
      g.glugT = P.glug * (.7 + R() * .6)
      const n = Math.min(g.snorkelAir, 3 + Math.floor(R() * 3))
      const p = snorkelTop()
      for (let i = 0; i < n; i++) {
        emit(p.x + (R() - .5) * 14, p.y + (R() - .5) * 14, 9 + R() * 6, {
          vx: g.vx * .4 + (R() - .5) * 40, vy: g.vy * .4, tau: .3, layer: 'front', src: 'snorkel'
        })
      }
      g.snorkelAir -= n
    }
  }

  // 局部密度决定画法：挤在一起 → 实心软盘；落单 → 空心线圈。
  // ringMix 在两种判法之间连续过渡（0 = 旧版，几乎全实心；1 = 前后景严格分开计数、新泡从空心开始）：
  //   · 新泡的初始实心度 = 1 - ringMix
  //   · 另一视觉深度的邻居按 (1 - ringMix) 的权重计入
  for (const b of bubbles) {
    let n = 0
    const crossW = 1 - P.ringMix
    for (const c of bubbles) {
      if (
        c !== b &&
        Math.abs(c.x - b.x) < 40 &&
        Math.abs(c.y - b.y) < 40 &&
        Math.hypot(b.x - c.x, b.y - c.y) < (b.r + c.r) * 1.5
      ) n += c.layer === b.layer ? 1 : crossW
    }
    b.k = (b.k ?? 1) + (((n >= P.densN) ? 1 : 0) - (b.k ?? 1)) * Math.min(1, dt * 3)
  }

  // 路径记录
  if (contact !== null) {
    const spd = Math.hypot(g.vx, g.vy), last = path[path.length - 1]
    if (spd > 60 && (!last || Math.hypot(last.x - g.x, last.y - g.y) > 16)) {
      path.push({ x: g.x, y: g.y + (activeObj.noseOffset * activeObj.size) * .3, t: T, w: Crayon.clamp(spd / 500, 0, 1), seed: R() * 100 })
    }
  }

  // 泡泡动力学
  for (const b of bubbles) {
    b.age += dt
    const k = Math.exp(-dt / b.tau)
    const rise = P.rise * Math.sqrt(Math.max(.3, b.r / 7))
    b.vx *= k
    if (P.tauFix) {
      b.vy = -rise + (b.vy + rise) * k
    } else {
      b.vy *= k
      b.vy += (-rise - b.vy) * Math.min(1, dt * 1.6)
    }
    if (b.r > 6 || b.kind === 'ring') b.vx += Math.sin(T * 6 + b.phase) * 14 * dt * 6
    b.vx += (R() - .5) * 30 * dt * 8
    b.x += b.vx * dt; b.y += b.vy * dt
    if (b.y < waterHeight(b.x, T) + b.r * 1.5) b.alpha -= dt * 2.5
  }
  for (let i = bubbles.length - 1; i >= 0; i--) if (bubbles[i].alpha <= 0) bubbles.splice(i, 1)

  // 泡沫云扩散
  {
    const spread = expansion(contact === null ? 0 : T - contact)
    for (const f of froth) {
      f.age += dt
      f.x = frothX0 + f.u0 * (frothHalf + spread)
    }
    for (let i = froth.length - 1; i >= 0; i--) if (froth[i].age > froth[i].life) froth.splice(i, 1)
  }

  for (const d of drops) { d.age += dt; d.vy += GRAVITY * .9 * dt; d.x += d.vx * dt; d.y += d.vy * dt }
  for (let i = drops.length - 1; i >= 0; i--) if (drops[i].y > waterHeight(drops[i].x, T) + 4 || drops[i].age > 1.2) drops.splice(i, 1)
  while (path.length && T - path[0].t > P.swooshLife) path.shift()

  // 相机跟随
  const follow = contact === null ? 0 : smooth(wet / .34)
  const targetScreenY = (WATER * 0.5) + (WH * 0.5 - WATER * 0.5) * follow
  const target = P.camera && contact !== null ? Crayon.clamp(g.y - targetScreenY, 0, Math.max(0, WORLD_H - WH)) : 0
  camera += (target - camera) * Math.min(1, dt * 8)
}

function jumpTo(wetTarget) {
  replay()
  isPoised = false
  let guard = 0
  while ((contact === null || T - contact < wetTarget) && guard++ < 4000) step(1 / 120)
  P.pause = true; P.__sync('pause', true)
  updatePauseUI(true)
  updateHintBar()
}

// ==========================================
// 6. 渲染管线 (Render Pipeline)
// ==========================================
const wx = x => x * S, wy = y => (y - camera) * S

function draw() {
  const [tuftL, swooshL, bChalk, bPencil, fChalk, fPencil, invL] = layers
  for (const l of layers) {
    if (l.name.includes('pencil') || l.name.includes('swoosh')) l.grainStrength = P.grain
    else if (l.name.includes('chalk')) l.grainStrength = P.grain * .75
  }
  layers.forEach(l => l.clear())
  ctx.drawImage(bgCanvas, 0, -camera * S)

  // 水面横向手绘线
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2 * S; ctx.beginPath()
  for (let x = 0; x <= WW; x += 8) { const y = waterHeight(x, T); x ? ctx.lineTo(wx(x), wy(y)) : ctx.moveTo(wx(x), wy(y)) }
  ctx.stroke(); ctx.restore()

  // 侧锋与湍流
  if (P.showSwoosh) for (let i = 1; i < path.length; i++) {
    const p0 = path[i - 1], p1 = path[i], life = Crayon.clamp(1 - (T - p1.t) / P.swooshLife, 0, 1)
    if (life <= 0) continue
    const dx = p1.x - p0.x, dy = p1.y - p0.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, nx = -uy, ny = ux
    const Rs = Crayon.rng(p1.seed * 1000)
    if (Rs() < .55) {
      const side = Rs() < .5 ? 1 : -1, off = side * (P.swooshW * (.5 + Rs() * .6)), len = 60 + Rs() * 110
      const cx = p1.x + nx * off, cy = p1.y + ny * off, tilt = (Rs() - .5) * .5
      const ax = Math.cos(Math.atan2(uy, ux) + tilt), ay = Math.sin(Math.atan2(uy, ux) + tilt)
      const pts = []
      for (let k = 0; k <= 5; k++) {
        const u = k / 5 - .5, bend = Math.sin((u + .5) * Math.PI) * (Rs() - .5) * 18
        pts.push({ x: wx(cx + ax * len * u + nx * bend), y: wy(cy + ay * len * u + ny * bend) })
      }
      Crayon.scumble(swooshL.ctx, pts, { width: P.swooshW * S * (.35 + Rs() * .45), alpha: P.swooshA * life * (.5 + p1.w * .5), seed: p1.seed, taper: .85, swell: 1 })
    }
    if (P.tufts > 0 && i % 3 === 0) {
      const Rt = Crayon.rng(p1.seed * 100), side = Rt() < .5 ? 1 : -1
      const cx = p1.x + nx * side * (P.swooshW * 1.2 + 12), cy = p1.y + ny * side * (P.swooshW * 1.2 + 12)
      const base = Math.atan2(uy, ux) + (Rt() - .5) * 1.2, n = Math.round(12 * P.tufts)
      for (let j = 0; j < n; j++) {
        const ang = base + (Rt() - .5) * .5 + (j % 3 === 2 ? Math.PI / 2 : 0)
        Crayon.hatch(tuftL.ctx, wx(cx + (Rt() - .5) * 24), wy(cy + (Rt() - .5) * 24), ang, (10 + Rt() * 16) * S, {
          width: (1 + Rt() * 1.2) * S, color: 'rgb(30,70,120)', alpha: .38 * life * p1.w, seed: j, bend: .3
        })
      }
    }
  }

  // 泡泡
  const srcOn = { cloud: () => P.showCloud, bead: () => P.showBeads, snorkel: () => P.showSnorkel }
  for (const b of bubbles) {
    if (srcOn[b.src] && !srcOn[b.src]()) continue
    const a = Crayon.clamp(b.alpha, 0, 1), chalk = b.layer === 'back' ? bChalk : fChalk, pencil = b.layer === 'back' ? bPencil : fPencil
    const k = b.k ?? 1
    if (k > .05) {
      Crayon.disc(chalk.ctx, wx(b.x), wy(b.y), b.r * S, { alpha: a * (.5 + .4 * k), soft: .25, seed: b.seed, highlight: b.r > 8 && k > .6 ? .6 * a : 0 })
      if (b.r > 7 && (b.seed % 3) < 1) Crayon.ring(pencil.ctx, wx(b.x), wy(b.y), b.r * S * 1.02, { wobble: .1, turns: 1.05, gap: .25, width: 1.4 * S, seed: b.seed, alpha: .5 * a * k, color: 'rgb(140,200,190)' })
    }
    if (k < .95) Crayon.ring(pencil.ctx, wx(b.x), wy(b.y), b.r * S, { wobble: .12, turns: 1.12, gap: .08, width: Math.max(1.4, b.r * .16) * S, seed: b.seed, alpha: a * (1 - k) * .95 })
  }

  tuftL.composite(ctx); swooshL.composite(ctx); bChalk.composite(ctx); bPencil.composite(ctx)

  // 绘制当前物体 (Active Sprite)
  if (currentSprite.complete) {
    const h = activeObj.size * S
    const w = h * currentSprite.width / currentSprite.height
    const bob = isPoised && !dragging ? Math.sin(T * 3) * 3 : 0
    ctx.save()
    ctx.translate(wx(g.x), wy(g.y + bob))
    ctx.rotate(g.angle)
    ctx.drawImage(currentSprite, -w / 2, -h / 2, w, h)
    ctx.restore()
  }

  // 没入水下的 wash 蓝调
  if (P.wash > 0 && P.showWater) {
    ctx.save(); ctx.globalAlpha = P.wash; ctx.fillStyle = '#0799ea'; ctx.beginPath()
    for (let x = 0; x <= WW; x += 8) { const y = waterHeight(x, T); x ? ctx.lineTo(wx(x), wy(y)) : ctx.moveTo(wx(x), wy(y)) }
    ctx.lineTo(wx(WW), SH + 10); ctx.lineTo(0, SH + 10); ctx.closePath(); ctx.fill(); ctx.restore()
  }

  // 水面泡沫云
  if (P.showFroth) for (const f of froth) {
    const y = f.y - f.age * 5, r = f.r * (1 + f.age * .12)
    Crayon.disc(fChalk.ctx, wx(f.x), wy(y), r * S, { alpha: .92, soft: .4, seed: f.seed })
    if (f.inv) {
      Crayon.disc(invL.ctx, wx(f.x + 4), wy(y + 3), r * .45 * S, { rgb: '120,175,190', alpha: .45, soft: .3, seed: f.seed + 1 })
      if (f.seed % 2 < 1) Crayon.ring(invL.ctx, wx(f.x - 5), wy(y - 4), r * .4 * S, { wobble: .12, turns: 1.05, gap: .15, width: 1.6 * S, seed: f.seed + 2, alpha: .5, color: 'rgb(90,150,175)' })
    }
  }

  // 水面涟漪（半圆断弧）
  if (P.showRipple && contact !== null) {
    const wetR = T - contact, water = waterHeight(g.x, T), Rr = Crayon.rng(911)
    for (let i = 0; i < P.ringCount; i++) {
      const w = wetR - i * P.ringStagger
      if (w <= 0) continue
      const radius = Math.min(P.ringMax, expansion(w) * P.ringScale)
      if (radius < 8) continue
      const near = radius * .24, far = near / (1 + radius / 420), ry = (near + far) / 2
      const cy = water + 40 + ry
      const life = Crayon.clamp(1 - w / P.ringLife, 0, 1)
      const alpha = P.ringA * Math.pow(life, .8) * (1 - (i / P.ringCount) * P.ringFade)
      if (alpha <= .02) continue
      const half = Math.PI * P.ringArc, span = half * 2
      const segs = 2 + Math.round(Rr() * 2)
      let a0 = Math.PI / 2 - half
      for (let sg = 0; sg < segs; sg++) {
        const len = span * ((1 - P.ringGap) / segs) * (.7 + Rr() * .6)
        const a1 = Math.min(a0 + len, Math.PI / 2 + half)
        const pts = [], steps = Math.max(8, Math.round((a1 - a0) * radius / 5))
        for (let k = 0; k <= steps; k++) {
          const th = a0 + (a1 - a0) * k / steps
          const rr = 1 + .06 * (Crayon.noise1(th * 1.7 + i, 40 + sg) - .5) * 2
          pts.push({ x: wx(g.x + Math.cos(th) * radius * rr), y: wy(cy + Math.sin(th) * ry * rr) })
        }
        Crayon.stroke(fPencil.ctx, pts, {
          width: P.ringW * S * (1 - (i / P.ringCount) * .35), color: 'rgb(255,255,255)',
          alpha, seed: i * 13 + sg, taper: .9, swell: 1,
        })
        a0 = a1 + span * P.ringGap / segs
      }
    }
  }

  // 飞溅水滴
  for (const d of drops) {
    const a = Crayon.clamp(1 - d.age / 1.2, 0, 1), L = 10 + Math.hypot(d.vx, d.vy) * .02, ang = Math.atan2(d.vy, d.vx)
    Crayon.stroke(fChalk.ctx, [{ x: wx(d.x - Math.cos(ang) * L), y: wy(d.y - Math.sin(ang) * L) }, { x: wx(d.x), y: wy(d.y) }], {
      width: 4 * S, color: 'rgb(255,255,255)', alpha: .9 * a, seed: d.seed, taper: .9, swell: 0
    })
  }

  fChalk.composite(ctx); invL.composite(ctx); fPencil.composite(ctx)
}

// ==========================================
// 7. 物体切换与 UI 绑定 (Switching & UI Wiring)
// ==========================================
function switchObject(objId) {
  if (objId === 'goggle') objId = 'mask'
  if (!OBJECT_DEFS[objId]) return
  activeObjId = objId
  activeObj = OBJECT_DEFS[objId]
  loadActiveSprite()

  // 同步物理参数
  P.terminal = activeObj.terminal; P.__sync('terminal', P.terminal)
  P.buoy = activeObj.buoy; P.__sync('buoy', P.buoy)
  P.torque = activeObj.torque; P.__sync('torque', P.torque)
  P.airTotal = activeObj.baseAir; P.__sync('airTotal', P.airTotal)
  P.airTau = activeObj.airTau; P.__sync('airTau', P.airTau)
  P.froth = activeObj.frothCount; P.__sync('froth', P.froth)
  P.frothR = activeObj.frothR; P.__sync('frothR', P.frothR)
  P.cloud = activeObj.cloudCount; P.__sync('cloud', P.cloud)
  P.cloudR = activeObj.cloudR; P.__sync('cloudR', P.cloudR)
  P.cloudTau = activeObj.airTau * .45; P.__sync('cloudTau', P.cloudTau)
  P.snorkel = activeObj.snorkelAir; P.__sync('snorkel', P.snorkel)

  updateSwitcherButtons()
  replay()
  const n = activeObj.name[currentLang]
  const toastMsg = currentLang === 'zh'
    ? `${activeObj.icon} 点击${n}，让它坠入海里！`
    : `${activeObj.icon} Tap ${n} to dive into the sea!`
  Crayon.showToast(toastMsg)
}

function updateSwitcherButtons() {
  const container = document.getElementById('objSwitchers')
  if (!container) return
  container.innerHTML = ''
  const currentKey = (activeObjId === 'goggle') ? 'mask' : activeObjId
  const otherKeys = PRIMARY_OBJECTS.filter(k => k !== currentKey)
  for (const k of otherKeys) {
    const o = OBJECT_DEFS[k]
    const btn = document.createElement('button')
    btn.className = `cr-obj-btn cr-obj-${k}`
    btn.title = `Switch to ${o.name.en} / 切换为${o.name.zh}`
    
    const img = document.createElement('img')
    img.src = o.src
    img.alt = o.name[currentLang]
    img.className = `cr-obj-thumb cr-thumb-${k}`
    btn.appendChild(img)
    
    btn.onclick = () => switchObject(k)
    container.appendChild(btn)
  }
}

// 拖拽控制 (Drag & Drop)
function toWorld(e) {
  const r = cv.getBoundingClientRect()
  return {
    x: (e.clientX - r.left) / r.width * WW,
    y: (e.clientY - r.top) / r.height * WH + camera
  }
}

// 仅在空中悬停状态允许抓取与调整下落高度
function isHit(w) {
  if (!g || !isPoised) return false
  const dx = Math.abs(w.x - g.x)
  const dy = Math.abs(w.y - g.y)
  if (activeObj.id === 'crayon') {
    return dx < 30 && dy < activeObj.size * 0.65
  }
  return Math.hypot(w.x - g.x, w.y - g.y) < activeObj.size * 0.55
}

let dragOffsetX = 0, dragOffsetY = 0
let pointerStartPos = null

cv.addEventListener('pointerdown', e => {
  if (!isPoised) return
  const w = toWorld(e)
  if (isHit(w)) {
    dragging = true
    pointerStartPos = { x: e.clientX, y: e.clientY }
    dragOffsetX = w.x - g.x
    dragOffsetY = w.y - g.y
    try { cv.setPointerCapture(e.pointerId) } catch(err) {}
    cv.style.cursor = 'grabbing'
    g.vx = 0; g.vy = 0; g.av = 0
  }
})

window.addEventListener('pointermove', e => {
  const w = toWorld(e)
  if (!dragging) {
    cv.style.cursor = isHit(w) ? 'grab' : 'default'
  } else {
    cv.style.cursor = 'grabbing'
    g.x = Crayon.clamp(w.x - dragOffsetX, 80, WW - 80)
    // 限制拖拽范围仅在水面以上（从顶部 50px 到贴近水面）
    const maxNoseY = waterHeight(g.x, T) - 15
    const maxY = maxNoseY - activeObj.noseOffset * activeObj.size
    g.y = Crayon.clamp(w.y - dragOffsetY, 60, maxY)
    g.vx = 0; g.vy = 0; g.av = 0
  }
})

window.addEventListener('pointerup', e => {
  if (dragging) {
    dragging = false
    try { cv.releasePointerCapture(e.pointerId) } catch(err) {}
    cv.style.cursor = 'default'
    // 无论是直接点击还是拖拽松手，均触发自由落体
    isPoised = false
    contact = null
    path = []
    bubbles = []
    froth = []
    drops = []
    g.vx = 0; g.vy = 0; g.av = 0; g.air = 0; g.hover = 0
    updateHintBar()
  }
})

function updateHintBar() {
  const dict = I18N[currentLang]
  const dtEl = document.getElementById('hintDesktop')
  if (dtEl) {
    dtEl.innerHTML =
      '<span class="cr-hint-item cr-hint-play"><svg class="cr-play-icon" viewBox="0 0 24 24" width="13" height="13"><polygon points="5 3 19 12 5 21 5 3"/></svg> ' + dict.hintPlayDrop + '</span>' +
      '<span class="cr-hint-item"><kbd class="cr-badge">' + (currentLang === 'zh' ? '拖拽' : 'Drag') + '</kbd> ' + dict.hintDragDrop + '</span>' +
      '<span class="cr-hint-item"><kbd class="cr-badge">Space</kbd> ' + dict.hintReset + '</span>' +
      '<span class="cr-hint-item"><kbd class="cr-badge">P</kbd> ' + dict.hintPause + '</span>' +
      '<span class="cr-hint-item"><kbd class="cr-badge">C</kbd> ' + dict.hintPanel + '</span>'
  }
  const poisedEl = document.getElementById('hintMobilePoised')
  const droppedEl = document.getElementById('hintMobileDropped')
  const poisedText = document.getElementById('hintMobileText')
  const orSelectText = document.getElementById('hintMobileOrSelect')
  if (poisedText) poisedText.textContent = dict.hintMobilePoised || dict.hintMobile
  if (orSelectText) orSelectText.textContent = dict.hintMobileOrSelect || ''

  if (poisedEl && droppedEl) {
    if (isPoised) {
      poisedEl.classList.add('visible')
      droppedEl.classList.remove('visible')
    } else {
      poisedEl.classList.remove('visible')
      droppedEl.classList.add('visible')
    }
  }
}

const mbReset = document.getElementById('mobileResetBtn')
if (mbReset) {
  mbReset.onclick = (e) => {
    e.stopPropagation()
    replay()
  }
}

// 暂停状态联动
function updatePauseUI(isPaused) {
  const badge = document.getElementById('pausedBadge')
  if (badge) {
    badge.textContent = I18N[currentLang].paused
    badge.classList.toggle('visible', isPaused)
  }
}

// 复制参数分享链接
function copyShareLink() {
  const params = new URLSearchParams()
  params.set('obj', activeObjId)
  params.set('lang', currentLang)
  const keys = ['terminal','buoy','torque','spreadRate','spreadPow','froth','frothR','ringCount','cloudTau','airTotal','airTau','tauFix','ringMix','grain']
  for (const k of keys) {
    if (k in P) params.set(k, typeof P[k] === 'boolean' ? (P[k] ? '1' : '0') : P[k])
  }
  const shareUrl = `${location.origin}${location.pathname}?${params.toString()}`
  navigator.clipboard.writeText(shareUrl).then(() => {
    Crayon.showToast(I18N[currentLang].shareCopied)
  }).catch(() => {
    prompt(I18N[currentLang].shareCopied, shareUrl)
  })
}

// 键盘快捷键监听
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return
  if (e.code === 'Space') {
    e.preventDefault()
    replay()
  }
  if (e.key === 'p' || e.key === 'P') {
    P.pause = !P.pause
    P.__sync('pause', P.pause)
    updatePauseUI(P.pause)
  }
  if (e.key === '1') jumpTo(.55)
  if (e.key === '2') jumpTo(1.5)
  if (e.key === '3') jumpTo(5.0)
  if (e.key === 'f' || e.key === 'F') {
    const w = contact === null ? 0 : T - contact
    P.tauFix = !P.tauFix; P.__sync('tauFix', P.tauFix)
    if (w > 0) jumpTo(w)
  }
})

// 语言切换
function setLanguage(lang) {
  currentLang = lang
  localStorage.setItem('crayon_dive_lang', lang)
  localStorage.setItem('goggle_sink_lang', lang)
  const dict = I18N[lang]

  // 更新面板文字
  if (P.__dom) {
    P.__dom.headTitle.textContent = dict.panelTitle
    for (const id in P.__dom.secTitles) {
      const key = 'sec' + id.charAt(0).toUpperCase() + id.slice(1)
      if (dict[key]) P.__dom.secTitles[id].textContent = dict[key]
    }

        const t = easeInOut((f - 615) / 30)
        curX = lerp(centerX, centerX + 120, t)
        curY = lerp(centerY, centerY + 140, t)
        isClicking = false
      } else {
        curX = centerX + 120
        curY = centerY + 140
        isClicking = false
      }

      step(vdt)
      draw()
      drawExactBrowserUI(curX, curY, isClicking, pressedKey)

      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.94))
      await fetch(`http://localhost:3456/save-frame?anim=${animName}&i=${f}`, { method: 'POST', body: blob })
    }
    await fetch(`http://localhost:3456/done?anim=${animName}`, { method: 'POST' })
  }
}

if (q.has('record')) {
  runRecorder(q.get('record'))
} else {
  loop()
}
</script>
</body>
</html>
